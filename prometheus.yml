global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'order-service'
    metrics_path: '/order-service/metrics'
    static_configs:
      # host.docker.internal works for Docker Desktop (Windows/Mac) to connect to the host
      - targets: ['host.docker.internal:8080']
  
  - job_name: 'payment-service'
    metrics_path: '/payment-service/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['host.docker.internal:8081']
  
  - job_name: 'inventory-service'
    metrics_path: '/inventory-service/metrics'
    static_configs:
      - targets: ['host.docker.internal:8082']
